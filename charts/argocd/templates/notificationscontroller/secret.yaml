{{- $v := .Values -}}
{{- $global := $v.global -}}
{{- $main := $v.notificationscontroller -}}
{{- $sec := (index $main.config "argocd-notifications-secret") -}}

{{- if $main.enabled -}}
{{- if $sec.enabled -}}
--- # --------------------------------------------------------------------------------- Secret
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  labels:
    app.kubernetes.io/component: notifications-controller
    app.kubernetes.io/name: argocd-notifications-controller
    {{- include "common.keyValues" ( 
        dict "kvs" ( list $global.labels 
                          $v.labels
                          $main.labels  ) ) | nindent 4 }}
  annotations:
    {{- include "common.keyValues" ( 
        dict "kvs" ( list $global.annotations  
                          $v.annotations
                          $main.annotations ) ) | nindent 4 }}
type: Opaque
{{- with $sec.data }}
data:
  {{- . | toYaml | nindent 2 }}
{{- end }}
{{- with $sec.stringData }}
stringData:
  {{- . | toYaml | nindent 2 }}
{{- end }}
{{- end -}}
{{- end -}}