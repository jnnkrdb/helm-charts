on:
  workflow_call:
    inputs:
      charts-path:
        description: |
          This is the directory, in which the subdirectories are places, which contain the helm-charts. 
          The directory would look like this 
            -> 'charts/<chart-dir>/Chart.yaml' 
          and the value would be 'charts'."
        required: false
        type: string
        default: "charts"

jobs:
  bump:
    if: (github.event.label.name == 'version:patch' || github.event.label.name == 'version:minor' || github.event.label.name == 'version:major') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHARTS_DIR: ${{ inputs.charts-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      #- uses: actions/checkout@v7
      #  with:
      #    ref: ${{ github.head_ref }}

      - name: Determine bump type
        id: bump
        run: |
          case "${{ github.event.label.name }}" in
            version:patch) echo "type=patch" >> $GITHUB_OUTPUT ;;
            version:minor) echo "type=minor" >> $GITHUB_OUTPUT ;;
            version:major) echo "type=major" >> $GITHUB_OUTPUT ;;
          esac

      - name: Bump versions
        run: |
          # Find changed charts
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^$CHARTS_DIR/' | cut -d'/' -f2 | sort -u)
          
          for chart in $CHANGED; do

            if [ -f "$CHARTS_DIR/$chart/Chart.yaml" ]; then

              CURRENT=$(grep '^version:' $CHARTS_DIR/$chart/Chart.yaml | awk '{print $2}')

              IFS='.' read -r major minor patch <<< "$CURRENT"
              
              case "${{ steps.bump.outputs.type }}" in

                patch) NEW="$major.$minor.$((patch + 1))" ;;

                minor) NEW="$major.$((minor + 1)).0" ;;

                major) NEW="$((major + 1)).0.0" ;;

              esac
              
              sed -i "s/^version: .*/version: $NEW/" $CHARTS_DIR/$chart/Chart.yaml

              echo "Bumped $chart from $CURRENT to $NEW"

            fi

          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CHARTS_DIR/*/Chart.yaml
          git commit -m "chore: bump chart versions [${{ steps.bump.outputs.type }}]"
          git push origin HEAD:${{ github.head_ref }}