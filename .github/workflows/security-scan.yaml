# .github/workflows/security-scan.yml
name: Security Scan

on:
  push:
    paths:
      - 'charts/**'
      - '.github/workflows/security-scan.yaml'
      - '.github/workflows/workflow.security-scan.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/security-scan.yaml'
      - '.github/workflows/workflow.security-scan.yaml'
  #schedule:
  #  - cron: '0 0 * * 0'  # Weekly

jobs:
  chart-tests:
    uses: ./.github/workflows/workflow.security-scan.yaml
    with:
      charts-path: charts
      chart-test-yaml: ct.yaml