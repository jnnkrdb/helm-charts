# .github/workflows/release-all.yml
name: Release All Changed Charts

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'charts/**'

jobs:
  release-all:
    uses: ./.github/workflows/workflow.release-all.yaml
    with:
      #charts-path: charts
      chart-test-yaml: ct.yaml
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      registry-repopath: ${{ github.repository_owner }}/helm-charts
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}