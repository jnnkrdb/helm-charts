on:
  workflow_call:
    inputs:
      charts-path:
        description: |
          This is the directory, in which the subdirectories are places, which contain the helm-charts. 
          The directory would look like this 
            -> 'charts/<chart-dir>/Chart.yaml' 
          and the value would be 'charts'."
        required: false
        type: string
        default: "charts"
    secrets:
      github-token:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: ${{ inputs.charts-path }}
        env:
          CR_TOKEN: "${{ secrets.github-token }}"