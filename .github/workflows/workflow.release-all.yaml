on:
  workflow_call:
    inputs:
      chart-test-yaml:
        description: |
          This variable holds the path to the required chart-test configuration yaml. 
          Most of the times its stored under the root path of a repository as ct.yaml.
        required: true
        type: string
      #charts-path:
      #  description: |
      #    This is the directory, in which the subdirectories are places, which contain the helm-charts. 
      #    The directory would look like this 
      #      -> 'charts/<chart-dir>/Chart.yaml' 
      #    and the value would be 'charts'."
      #  required: false
      #  type: string
      #  default: "charts"
        
      registry:
        description: |
          This is the registry, where the charts should be uploaded to. Default is ghcr.io.
        required: false
        type: string
        default: "ghcr.io"
      registry-username:
        description: |
          This is the user, which is used to authenticate against the given registry.
        required: true
        type: string
      registry-repopath:
        description: |
          This is the path, under which the helmcahrts should be uploaded to. Default is "{{ github.repository_owner }}/helm-charts".
        required: false
        type: string
        default: "${{ github.repository_owner }}/helm-charts"
    secrets:
      registry-password:
        required: true


jobs:
  detect:
    name: Detect changed Charts
    runs-on: ubuntu-latest
    env:
      CHART_TEST_CONFIGURATION_YAML: ${{ inputs.chart-test-yaml }}
    outputs:
      has_changed: ${{ steps.list-changed.outputs.has_changed }}
      changed_charts: ${{ steps.list-changed.outputs.changed_charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: List changed charts
        id: list-changed
        run: |
          changed_charts=$(ct list-changed --config $CHART_TEST_CONFIGURATION_YAML)
          if [[ -n "$changed_charts" ]]; then
            echo "Changed charts: $changed_charts"
            echo "has_changed=true" >> $GITHUB_OUTPUT
            echo "changed_charts=$changed_charts" >> $GITHUB_OUTPUT
          fi
  
  #detect-changes:
  #  runs-on: ubuntu-latest
  #  outputs:
  #    charts: ${{ steps.changes.outputs.charts }}
  #  steps:
  #    - uses: actions/checkout@v7
  #      with:
  #        fetch-depth: 0
#
  #    - name: Detect changed charts
  #      id: changes
  #      run: |
  #        CHANGED_CHARTS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
  #          grep '^' | \
  #          cut -d'/' -f2 | \
  #          sort -u | \
  #          jq -R -s -c 'split("\n") | map(select(. != ""))')
  #        echo "$CHANGED_CHARTS"
  #        echo "charts=$CHANGED_CHARTS" >> $GITHUB_OUTPUT

  release:
    needs: detect
    if: needs.detect.outputs.has_changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        #chart: ${{ fromJson(needs.detect-changes.outputs.charts) }}
        chart: ${{ fromJson(needs.detect.outputs.changed_charts) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Registry
        run: |
          echo "${{ secrets.registry-password }}" | helm registry login ${{ inputs.registry }} -u ${{ inputs.registry-username }} --password-stdin

      - name: Get chart version
        id: version
        run: |
          VERSION=$(grep '^version:' ${{ matrix.chart }}/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build dependencies
        run: |
          helm dependency build ${{ matrix.chart }}

      - name: Package chart
        run: |
          helm package ${{ matrix.chart }}

      - name: Push to Registry
        run: |
          helm push $(basename "${{ matrix.chart }}")-${{ steps.version.outputs.version }}.tgz \
            oci://${{ inputs.registry }}/${{ inputs.registry-repopath }}

      - name: Sign with Cosign
        run: |
          cosign sign --yes \
            ${{ inputs.registry }}/${{ inputs.registry-repopath }}/$(basename "${{ matrix.chart }}"):${{ steps.version.outputs.version }}