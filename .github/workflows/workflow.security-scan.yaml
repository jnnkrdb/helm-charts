on:
  workflow_call:
    inputs:
      charts-path:
        description: |
          This is the directory, in which the subdirectories are places, which contain the helm-charts. 
          The directory would look like this 
            -> 'charts/<chart-dir>/Chart.yaml' 
          and the value would be 'charts'."
        required: false
        type: string
        default: "charts"

jobs:
  kubesec:
    name: Kubesec Scan
    runs-on: ubuntu-latest
    env:
      CHARTS_DIR: ${{ inputs.charts-path }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubesec
        run: |
          curl -LO https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz
          tar xzf kubesec_linux_amd64.tar.gz
          sudo mv kubesec /usr/local/bin/

      - name: Scan charts
        run: |
          # Find changed charts
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^$CHARTS_DIR/' | cut -d'/' -f2 | sort -u)
          
          for chart in $CHANGED; do
            echo "Scanning $chart"
            helm template test "$chart" | kubesec scan -
          done

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    env:
      CHARTS_DIR: ${{ inputs.charts-path }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '$CHARTS_DIR/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    env:
      CHARTS_DIR: ${{ inputs.charts-path }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Template charts
        run: |
          # Find changed charts
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^$CHARTS_DIR/' | cut -d'/' -f2 | sort -u)
          
          mkdir -p rendered
          for chart in $CHANGED; do
            name=$(basename "$chart")
            helm template test "$chart" > rendered/${name}.yaml
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: rendered/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif