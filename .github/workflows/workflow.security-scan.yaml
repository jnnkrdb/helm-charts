on:
  workflow_call:
    inputs:
      chart-test-yaml:
        description: |
          This variable holds the path to the required chart-test configuration yaml. 
          Most of the times its stored under the root path of a repository as ct.yaml.
        required: true
        type: string
      charts-path:
        description: |
          This is the directory, in which the subdirectories are places, which contain the helm-charts. 
          The directory would look like this 
            -> 'charts/<chart-dir>/Chart.yaml' 
          and the value would be 'charts'."
        required: false
        type: string
        default: "charts"

jobs:
  detect:
    name: Detect changed Charts
    runs-on: ubuntu-latest
    env:
      CHART_TEST_CONFIGURATION_YAML: ${{ inputs.chart-test-yaml }}
    outputs:
      has_changed: ${{ steps.list-changed.outputs.has_changed }}
      changed_charts: ${{ steps.list-changed.outputs.changed_charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: List changed charts
        id: list-changed
        run: |
          changed_charts=$(ct list-changed --config $CHART_TEST_CONFIGURATION_YAML)
          
          if [[ -n "$changed_charts" ]]; then
            echo "Changed charts: $changed_charts"
            echo "has_changed=true" >> $GITHUB_OUTPUT
            echo "changed_charts=$changed_charts" >> $GITHUB_OUTPUT
          fi

  kubesec:
    name: Kubesec Scan
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_changed
    needs: detect
    env:
      CHANGED_CHARTS: ${{ needs.detect.outputs.changed_charts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubesec
        run: |
          curl -LO https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz
          tar xzf kubesec_linux_amd64.tar.gz
          sudo mv kubesec /usr/local/bin/

      - name: Scan charts
        run: |
          for chart in $CHANGED_CHARTS; do
            echo "Scanning $chart"
            helm dependency update $chart
            helm template test "$chart" | kubesec scan -
          done

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '${{ inputs.charts-path }}/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      #- name: Upload Trivy scan results
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: 'trivy-results.sarif'

  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_changed
    needs: detect
    env:
      CHANGED_CHARTS: ${{ needs.detect.outputs.changed_charts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Template charts
        run: |
          mkdir -p rendered
          for chart in $CHANGED_CHARTS; do
            name=$(basename "$chart")
            helm dependency update $chart
            helm template test "$chart" > rendered/${name}.yaml
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: rendered/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif

      #- name: Upload Checkov results
      #  uses: github/codeql-action/upload-sarif@v4
      #  if: always()
      #  with:
      #    sarif_file: checkov-results.sarif