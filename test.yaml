# Source: vaultwarden/templates/workload/deployment.yaml
# --------------------------------------------------------------------------------- Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-vaultwarden
  labels:
    helm.sh/chart: vaultwarden-1.1.1
    app.kubernetes.io/name: release-name-vaultwarden
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.37.4"
    app.kubernetes.io/managed-by: Helm
    
  annotations:
    
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: release-name-vaultwarden
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      annotations:
        
      labels:
        app.kubernetes.io/name: release-name-vaultwarden
        app.kubernetes.io/instance: release-name
        
    spec:
      
      nodeSelector:
        kubernetes.io/os: linux
      
      
      
      
      
      
      
      serviceAccountName: sa-release-name-vaultwarden
      imagePullSecrets:
        
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: release-name-vaultwarden-data
      containers:
        - name: vaultwarden
          image: docker.io/vaultwarden/server:1.37.4
          imagePullPolicy: "Always"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          ports:
            - name: "http"
              containerPort: 80
              protocol: TCP
            - name: "websocket"
              containerPort: 3012
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: "/data"
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
---
# Source: vaultwarden/templates/backup/cronjob.yaml
# --------------------------------------------------------------------------------- CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-name-vaultwarden-backup
  annotations:
    
  labels:
    helm-charts.jnnkrdb.github.io/vaultwarden: "backup"
    helm.sh/chart: vaultwarden-1.1.1
    app.kubernetes.io/name: release-name-vaultwarden
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.37.4"
    app.kubernetes.io/managed-by: Helm
    
spec:
  concurrencyPolicy: "Forbid"
  failedJobsHistoryLimit: 3
  schedule: "0 */6 * * *"
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  timeZone: "Etc/UTC"
  jobTemplate: 
    spec:
      parallelism: 1
      template:
        spec:        
        nodeSelector:
          kubernetes.io/os: linux
        
        
        
        
        
        
        
          serviceAccountName: sa-release-name-vaultwarden
          imagePullSecrets:
            
          restartPolicy: "OnFailure"
          volumes:
            - name: scripts
              configMap:
                name: release-name-vaultwarden-backup-scripts
            - name: data
              persistentVolumeClaim:
                claimName: release-name-vaultwarden-data
            - name: backup
              persistentVolumeClaim:
                claimName: release-name-vaultwarden-backup
          containers:
            - name: vaultwardenbackup
              image: docker.io/vaultwarden/server:1.37.4
              imagePullPolicy: "Always"
              command:
                - /bin/sh
              args:
                - /scripts/vaultwarden.backup.sh
              env:
                - name: VAULTWARDEN_DATA_DIR
                  value: "/data"
                - name: VAULTWARDEN_BACKUP_DIR
                  value: "/backups"
                - name: VAULTWARDEN_VERSION
                  value: "1.37.4"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: data
                  mountPath: "/data"
                - name: backup
                  mountPath: "/backups"
